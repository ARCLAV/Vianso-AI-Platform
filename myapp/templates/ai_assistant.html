<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VIANSO AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{

    background:#f7f8fc;

    min-height:100vh;

    padding:40px 20px;

    overflow-x:hidden;
}

/* Main Container */

.container{

    max-width:900px;

    margin:auto;

    text-align:center;

    animation:fadeUp .8s ease;
}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:
        translateY(25px);
    }

    to{

        opacity:1;

        transform:
        translateY(0);
    }
}

/* Orb */

.loader-wrapper{

    display:flex;

    justify-content:center;

    align-items:center;

    margin:0 auto;

    width:80px;

    height:80px;
}

.loader{

    width:80px;

    height:80px;

    border-radius:50%;

    background:
    radial-gradient(
        circle at 30% 30%,
        #f3d6ff,
        #d18cff,
        #8b5cf6
    );

    animation:
    float 3s ease-in-out infinite,
    pulse 2.5s ease-in-out infinite;
}

@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }

    100%{
        transform:translateY(0);
    }
}

@keyframes pulse{

    0%{

        box-shadow:
        0 0 15px rgba(139,92,246,.4);
    }

    50%{

        box-shadow:
        0 0 45px rgba(139,92,246,.9);
    }

    100%{

        box-shadow:
        0 0 15px rgba(139,92,246,.4);
    }
}

/* Brand */

.ai-brand{

    margin-top:18px;

    font-size:14px;

    font-weight:700;

    letter-spacing:5px;

    color:#8b5cf6;

    text-transform:uppercase;
}

/* Heading */

h1{

    margin-top:30px;

    font-size:52px;

    font-weight:700;

    color:#1e293b;
}

h2{

    margin-top:8px;

    font-size:52px;

    font-weight:700;

    color:#1e293b;
}

h2 span{

    color:#a855f7;
}

/* Chat Box */

.chat-box{

    background:white;

    margin-top:30px;

    border-radius:24px;

    padding:20px;

    max-width:650px;

    margin-left:auto;
    margin-right:auto;

    box-shadow:
    0 10px 25px rgba(0,0,0,.06);

    border:1px solid #eef2f7;
}

textarea{

    width:100%;

    height:80px;

    border:none;

    outline:none;

    resize:none;

    background:transparent;

    font-size:16px;
}
textarea::placeholder{

    color:#94a3b8;
}

/* Bottom Bar */

.bottom-bar{

    margin-top:20px;

    display:flex;

    justify-content:flex-end;
}

.send-btn{

    width:55px;

    height:55px;

    border:none;

    border-radius:16px;

    background:#111827;

    color:white;

    font-size:22px;

    cursor:pointer;

    transition:.3s;
}

.send-btn:hover{

    transform:
    translateY(-3px);
}

/* Response */

.response-box{

    margin-top:30px;

    background:white;

    padding:30px;

    border-radius:24px;

    text-align:left;

    line-height:1.8;

    color:#334155;

    box-shadow:
    0 10px 30px rgba(0,0,0,.08);
}

/* Loader while AI thinks */

.generating{

    display:none;

    margin-top:20px;

    color:#8b5cf6;

    font-weight:600;
}

</style>

</head>
<body>

<div class="container">

    <!-- AI Orb -->

    <div class="loader-wrapper">

        <div class="loader"></div>

    </div>

    <div class="ai-brand">
        VIANSO AI
    </div>

    <!-- Heading -->

    <h1>
        Good Afternoon, Admin
    </h1>

    <h2>
        What's on
        <span>your mind?</span>
    </h2>

    <!-- Form -->

    <form method="POST" id="aiForm">

        {% csrf_token %}

        <div class="chat-box">

            <textarea
                name="prompt"
                id="prompt"
                placeholder="Ask AI a question or make a request..."
                required></textarea>

            <div class="bottom-bar">

                <button
                    type="submit"
                    class="send-btn">
                    ➜
                </button>

            </div>

        </div>

    </form>

    <!-- Loading Text -->

    <div
        class="generating"
        id="loadingText">

        ✨ VIANSO AI is thinking...

    </div>

    <!-- Response -->

    {% if response %}

    <div class="response-box">

        <h3 style="
        margin-bottom:15px;
        color:#111827;">

            AI Response

        </h3>

        <p>

            {{ response }}

        </p>

    </div>

    {% endif %}

</div>

<script>

const form =
document.getElementById("aiForm");

const loading =
document.getElementById("loadingText");

form.addEventListener(
"submit",
function(){

    loading.style.display =
    "block";

}
);

</script>

</body>

</html>
